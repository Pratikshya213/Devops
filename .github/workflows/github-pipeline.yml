name: GoCart GitHub Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VM using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}

          script: |
            cd /home/ubuntu/devops/gocart-v2/gocart
            git pull origin main

            sudo docker stop gocart || true
            sudo docker rm gocart || true

            sudo docker build -t gocart-web:latest .

            sudo docker run -d \
              --name gocart \
              --restart unless-stopped \
              -p 3000:3000 \
              gocart-web:latest